# Builds an unsigned (ad-hoc signed) universal MetroMind.app on a GitHub macOS runner.
# Manual or on version tags only: macOS minutes count 10x against private-repo quotas.
name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build MetroMind.app
        run: bash scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MetroMind-macos
          path: dist/macos/MetroMind-macos.zip
          if-no-files-found: error
